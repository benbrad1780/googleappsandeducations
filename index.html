<!DOCTYPE html>
<html>
<head>
    <title>Games</title>
</head>

<body style="background:#111; color:white; font-family:sans-serif; text-align:center;">

    <h1 style="margin-top:40px;">🎮 Games</h1>

    <div style="display:flex; justify-content:center; gap:40px; flex-wrap:wrap; margin-top:50px;">

        <!-- Eaglercraft -->
        <div>
            <img src="https://via.placeholder.com/200x120?text=Eaglercraft" style="border-radius:10px;"><br><br>
            <a href="eagler.html">
                <button style="
                    background: linear-gradient(135deg, #4CAF50, #2E7D32);
                    color: white;
                    border: none;
                    padding: 12px 25px;
                    font-size: 16px;
                    border-radius: 10px;
                    cursor: pointer;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                    transition: 0.3s;
                "
                onmouseover="this.style.transform='scale(1.1)'"
                onmouseout="this.style.transform='scale(1)'">
                    🎮 Play Eaglercraft
                </button>
            </a>
        </div>

        <!-- Buckshot Roulette -->
        <div>
            <img src="https://via.placeholder.com/200x120?text=Buckshot" style="border-radius:10px;"><br><br>
            <a href="buckshot.html">
                <button style="
                    background: linear-gradient(135deg, #ff4d4d, #990000);
                    color: white;
                    border: none;
                    padding: 12px 25px;
                    font-size: 16px;
                    border-radius: 10px;
                    cursor: pointer;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                    transition: 0.3s;
                "
                onmouseover="this.style.transform='scale(1.1)'"
                onmouseout="this.style.transform='scale(1)'">
                    💀 Play Buckshot Roulette
                </button>
            </a>
        </div>

        <!-- FNAF -->
        <div>
            <img src="https://via.placeholder.com/200x120?text=FNAF+1" style="border-radius:10px;"><br><br>
            <a href="fnaf.html">
                <button style="
                    background: linear-gradient(135deg, #444, #000);
                    color: white;
                    border: none;
                    padding: 12px 25px;
                    font-size: 16px;
                    border-radius: 10px;
                    cursor: pointer;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
                    transition: 0.3s;
                "
                onmouseover="this.style.transform='scale(1.1)'"
                onmouseout="this.style.transform='scale(1)'">
                    🐻 Play FNAF 1
                </button>
            </a>
        </div>

    </div>

</body>
</html>
